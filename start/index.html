<script>
(()=>{
const API="https://script.google.com/macros/s/AKfycbyvcWi9KVAJ0elYh2XVjc_K0tOInPXsyVq9N1q9noAMDzzo0FTYPtSdF7ANxorwy3nO/exec", PACK="start", D=JSON.parse(document.getElementById('d').textContent);
const LS={get:k=>{try{return localStorage.getItem(k)}catch(_){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(_){}},del:k=>{try{localStorage.removeItem(k)}catch(_){}}};
let dev=LS.get('mv-dev'); if(!dev){dev=[...crypto.getRandomValues(new Uint8Array(12))].map(b=>b.toString(16).padStart(2,'0')).join('');LS.set('mv-dev',dev)}
const $=id=>document.getElementById(id), ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const T={
 pending:['Sorğun göndərildi. Ödəniş təsdiqlənən kimi giriş açılacaq.','Запрос отправлен. Доступ откроется, как только оплата будет подтверждена.'],
 declined:['Giriş təsdiqlənmədi. Ödəniş üçün WhatsApp-a yaz.','Доступ не подтверждён. Напиши в WhatsApp по поводу оплаты.'],
 device:['Bu nömrə başqa cihazda açılıb. Təsdiq gözlənilir.','Этот номер уже открыт на другом устройстве. Ждём подтверждения.'],
 none:['Bu nömrə ilə sorğu yoxdur.','Запроса с этим номером нет.'],
 bad:['Adı və nömrəni düzgün yaz.','Проверь имя и номер.'],
 net:['Bağlantı alınmadı. Bir az sonra yenə yoxla.','Нет связи. Попробуй чуть позже.'],
 busy:['Bu gün sorğu çoxdur. WhatsApp-a yaz.','Сегодня слишком много запросов. Напиши в WhatsApp.']};
const say=(k,err)=>{const m=$('msg');m.className='msg'+(err?' err':'');m.innerHTML=k?T[k][0]+'<small>'+T[k][1]+'</small>':''};
async function call(a,phone,name){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({a,pack:PACK,phone,name:name||'',dev})});return r.json()}
async function show(k){const ck=await crypto.subtle.importKey('raw',ub(k),'AES-GCM',false,['decrypt']);
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(D.iv)},ck,ub(D.ct)));
  document.open();document.write(html);document.close()}
let timer=null;
function waitMode(on){$('form').hidden=on;$('again').hidden=!on}
async function check(a,phone,name,quiet){
  let j; try{j=await call(a,phone,name)}catch(_){if(!quiet)say('net',true);return}
  if(!j||!j.ok){say(j&&j.err==='busy'?'busy':'bad',true);return}
  if(j.status==='ok'&&j.k){clearInterval(timer);try{await show(j.k)}catch(_){say('net',true)}return}
  if(j.status==='none'){LS.del('mv-start-phone');waitMode(false);say('none',true);clearInterval(timer);return}
  LS.set('mv-start-phone',phone);waitMode(true);say(j.status,j.status==='declined');
  if(j.status==='declined'){clearInterval(timer);return}
  if(!timer)timer=setInterval(()=>{if(!document.hidden)check('pk_get',phone,'',true)},12000);
}
$('go').onclick=async()=>{const name=$('name').value.trim(),phone=$('phone').value.replace(/\D/g,'');
  if(name.length<2||phone.length<7){say('bad',true);return}
  $('go').disabled=true;say('');await check('pk_req',phone,name);$('go').disabled=false};
$('again').onclick=()=>{clearInterval(timer);timer=null;LS.del('mv-start-phone');waitMode(false);say('')};
document.addEventListener('visibilitychange',()=>{const p=LS.get('mv-start-phone');if(!document.hidden&&p&&!$('form').hidden===false)check('pk_get',p,'',true)});
const saved=LS.get('mv-start-phone'); if(saved){waitMode(true);check('pk_get',saved,'',false)}
})();
</script></body></html>
