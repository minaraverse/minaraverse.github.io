<script>
(async()=>{
const D=JSON.parse(document.getElementById('d').textContent), te=new TextEncoder(), KEY='mv-start-code';
const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const norm=s=>{s=(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');return s.length===10?s.slice(0,5)+'-'+s.slice(5):s};
async function open(code){
  const id=[...new Uint8Array(await crypto.subtle.digest('SHA-256',te.encode('mv-id:'+code)))].map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,10);
  const e=D.t[id]; if(!e) throw 0; const [wiv,w]=e.split('.');
  const base=await crypto.subtle.importKey('raw',te.encode(code),'PBKDF2',false,['deriveKey']);
  const wk=await crypto.subtle.deriveKey({name:'PBKDF2',salt:ub(D.s),iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const o=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(wiv)},wk,ub(w))));
  const ck=await crypto.subtle.importKey('raw',ub(o.k),'AES-GCM',false,['decrypt']);
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(D.iv)},ck,ub(D.ct)));
  try{localStorage.setItem(KEY,code)}catch(_){}
  window.__MV_N=o.n; try{history.replaceState(null,'',location.pathname)}catch(_){}
  document.open(); document.write(html.replace('</body>','<script>window.__MV_N='+o.n+';var f=document.querySelector("footer");if(f)f.insertAdjacentHTML("beforeend"," · № "+String('+o.n+').padStart(2,"0"));<\/script></body>')); document.close();
}
const err=document.getElementById('err'), inp=document.getElementById('code');
async function tryCode(c,quiet){c=norm(c); if(c.length!==11){if(!quiet)err.textContent='Kod 10 simvoldur · В коде 10 символов';return}
  err.textContent='…'; try{await open(c)}catch(_){try{localStorage.removeItem(KEY)}catch(e){} err.textContent=quiet?'':'Kod yanlışdır və ya deaktiv edilib · Код неверный или отключён'}}
document.getElementById('go').onclick=()=>tryCode(inp.value);
inp.addEventListener('keydown',e=>{if(e.key==='Enter')tryCode(inp.value)});
const h=(location.hash.match(/^#c-([A-Za-z0-9-]+)/)||[])[1]; let saved=null; try{saved=localStorage.getItem(KEY)}catch(_){}
if(h){inp.value=norm(h);tryCode(h)} else if(saved){tryCode(saved,true)}
})();
</script></body></html>
